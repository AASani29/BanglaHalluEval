<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengali / Banglish Annotator</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#1c1a17; --muted:#6b645a;
    --line:#e0dace; --accent:#b4562f; --accent2:#2f6d5b; --warn:#c0392b;
    --field:#faf8f3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
  select,button{font:inherit}
  select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
  .bar{flex:1;min-width:160px;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--accent2);width:0%}
  .count{font-size:13px;color:var(--muted);white-space:nowrap}
  main{max-width:940px;margin:0 auto;padding:20px 16px 140px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;
    box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .rowid{font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase}
  .field{margin-bottom:16px}
  .flabel{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .ftext{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    font-size:19px;white-space:pre-wrap;word-break:break-word}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.pair{grid-template-columns:1fr}}
  .controls{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .abtn{padding:12px 22px;border:2px solid var(--line);border-radius:10px;background:var(--field);
    cursor:pointer;font-size:15px;font-weight:600;min-width:74px;transition:.12s}
  .abtn:hover{border-color:var(--ink)}
  .abtn.no{border-color:var(--accent2)} .abtn.no.sel{background:var(--accent2);color:#fff}
  .abtn.yes{border-color:var(--warn)} .abtn.yes.sel{background:var(--warn);color:#fff}
  .abtn.skip{border-color:var(--muted)} .abtn.skip.sel{background:var(--muted);color:#fff}
  .abtn.num.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nav{display:flex;gap:10px;align-items:center}
  .nav button{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
  .hint{font-size:12px;color:var(--muted)}
  .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .grp .glab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-right:2px}
  .dl{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
  .done{color:var(--accent2);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Bengali / Banglish Annotator</h1>
  <select id="fileSel"></select>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <span class="count" id="count"></span>
  <button class="dl" id="dl">Download CSV</button>
</header>
<main>
  <div class="card" id="card"></div>
</main>
<div class="controls" id="controls"></div>

পুত্র ল্হা-লামা-ব্যাং-ছুব-ওদকে মুক্তিপণ দিতে বারণ করেন এবং ঐ অর্থ অতীশ দীপঙ্করকে তিব্বতে আনানোর জন্য ব্যয় করতে বলেন। বন্দীদশায় তাঁর মৃত্যু হয়। ল্হা-লামা-ব্যাং-ছুব-ওদ গুজ রাজ্যের রাজা হয়ে গুং-থং-পা নামে এক বৌদ্ধ উপাসককে ও আরো কয়েক জন অনুগামীকে অতীশ দীপঙ্করকে তিব্বতে আনানোর দায়িত্ব দেন। এরা নেপালের পথে বিক্রমশীলা বিহারে উপস্থিত হন এবং দীপঙ্করের সাথে সাক্ষাৎ করে সমস্ত সোনা নিবেদন করে ভূতপূর্ব রাজা ব্যাং-ছুব-য়ে-শেস'-ওদের বন্দী হওয়ার কাহিনী ও তাঁর শেষ ইচ্ছার কথা ব্যক্ত করলে অতীশ দীপঙ্কর অভিভূত হয়ে তিব্বত যাত্রা করেন।[36] এর ফলে পশ্চিম তিব্বতে বৌদ্ধ ধর্মের প্রভাব বিস্তার ঘটে।[32][37]:৩৮৮, ৩৯৪[38] ১০৭৩ খ্রিষ্টাব্দে সা-স্ক্যা বৌদ্ধবিহার এবং ১১৫৫ খ্রিষ্টাব্দে ম্ত্শুর-ফু বৌদ্ধবিহার স্থাপিত হয়। [39]:৩৭ এই সময় রাজধানী থোলিং বৌদ্ধধর্মের এক গুরুত্বপূর্ণ পীঠস্থানে পরিণত হয়।[32] ১০৮৮ খ্রিষ্টাব্দে ল্হা-লামা-ব্যাং-ছুব-ওদের পুত্র র্ত্সে-ল্দেকে (Wylie: rTse lde) দ্বাং-ল্দে (Wylie: dBang lde) নামক তাঁর ভ্রাতুষ্পুত্র হত্যা করলে গুজ ও পু-হ্রাং নামে দুইটি পৃথক রাজ্যে তাঁদের রাজ্য ভেঙ্গে যায়। দ্বাং-ল্দে গুজ রাজ্য নিজের অধিকারে রাখেন।[37]:৫৩-৬৬ ১১৩৭ খ্রিষ্টাব্দে কারাখানী খানাতের আক্রমণে গুজ রাজ্যের রাজা ব্ক্রা-শিস-র্ত্সে (Wylie: bKra shis rtse) মৃত্যুবরণ করলে রাজ্য কয়েক বছরের জন্য বিভক্ত হয়ে পড়ে। ১২৪০ খ্রিষ্টাব্দে মঙ্গোল সম্রাটেরা এই অঞ্চলের প্রশাসনিক অধিকার দ্রিগুং বৌদ্ধবিহারকে দান করেন। কিন্তু ১২৬৫ খ্রিষ্টাব্দে গ্রাগ্স-পা-ল্দে (Wylie: grags pa lde) নামক এক শক্তিশালী রাজার অধীনে গুজ পুনরায় এক রাজ্যে পরিণত হয় এবং প্রতিবেশী য়া-র্ত্সে (Wylie: ya rtse) রাজ্যকেও নিজেদের অধীনে নিয়ে আসে। ১২৭৭ খ্রিষ্টাব্দে তাঁর মৃত্যু হলে এই অঞ্চলটি সা-স্ক্যা বৌদ্ধসম্প্রদায়ের কর্তৃত্বে চলে আসে। কিন্তু ১৩৬৩ খ্রিষ্টাব্দে সা-স্ক্যা বৌদ্ধসম্প্রদায়ের পৃষ্ঠপোষক হিসেবে পরিচিত মঙ্গোল ইউয়ান রাজবংশের পতন ঘটলে গুজের রাজারা আবার শক্তিশালী হয় এবং ১৩৭৮ খ্রিষ্টাব্দে পু-হ্রাং অধিকারে আনতে সমর্থ হয়। পরবর্তী সময়ে গুজ ও মুস্তাং রাজ্যের মধ্যে পু-হ্রাং অঞ্চলের মধ্যে বহু বছর বিবাদ চালু থাকলেও শেষ পর্যন্ত পু-হ্রাং গুজের অন্তর্ভুক্ত হয়। চতুর্দশ শতকের শেষ দিকে গুজের শাসকেরা লাদাখ অঞ্চল কিছু বছরের জন্য অধিকারে আনতে সমর্থ হয়। ১৪৯৯ খ্রিষ্টাব্দে গুজের শাসকেরা পশ্চিম মধ্য তিব্বতের নবনির্মিত রিন-স্পুংস-পা রাজ্যকে স্বীকৃতি দিতে বাধ্য হয়। পঞ্চদশ ও ষোড়শ শতাব্দীতে গুজের রাজারা তিব্বতে শক্তিশালী হয়ে ওঠা দ্গে-লুগ্স ধর্মসম্প্রদায়ের প্রতি আনুগত্য দেখাতে শুরু করেন। ১৬২৪ খ্রিষ্টাব্দে আন্তোনিও দে আন্দ্রাদে ও তাঁর ভ্রাতা ম্যানুয়েল মারকুইস নামক দুই পর্তুগীজ যাজক ১৬২৪ খ্রিষ্টাব্দে গুজ রাজ্যে পৌঁছন। আন্তোনিও রাজ্যের সেচ ও কৃষিব্যবস্থার উন্নতিতে সহায়তার প্রতিশ্রুতি দেন এবং একটি গীর্জা নির্মাণ করে স্থানীয় অধিবাসীদের মধ্যে খ্রিষ্টধর্ম প্রচার করেন।[40] আন্তোনিওর লেখা একটি চিঠি থেকে জানা যায় যে, এই সময়ে গুজের কিছু সামরিক অধিকর্তা গুজের রাজাকে সিংহাসনচ্যূত করতে লাদাখীদের আমন্ত্রণ জানান। ১৬৩০ খ্রিষ্টাব্দে লাদাখী সেনাবাহিনী গুজ রাজ্যের রাজধানী অবরোধ করেন। গুজের রাজা খ্রি-ব্ক্রা-শিস-গ্রাগ্স-পা-ল্দে (Wylie: khri bkra shis grags pa lde) তাঁর বৌদ্ধধর্মাবলম্বী ভ্রাতার উপদেশে সমর্পণ করে গুজ রাজ্যকে লাদাখ রাজ্যের অধীনে করদ রাজ্যে পরিণত করেন।[41] এই সিদ্ধান্তের পর গুজের শেষ রাজা খ্রি-ব্ক্রা-শিস-গ্রাগ্স-পা-ল্দেকে লাদাখে বন্দী করে নিয়ে যাওয়া হয় এবং সেখানেই তাঁর মৃত্যু হয়। এই অভিযানের গুজে নির্মিত সমস্ত গীর্জাকে ধ্বংস করে দেওয়া হয়[38] কথিত আছে, এই অভিযানে লাদাখী সেনাবাহিনী গুজের অধিকাংশ জনগণকেই হত্যা করে, মাত্র দুইশত জন প্রাণ বাঁচিয়ে পালিয়ে যেতে সক্ষম হন।[42] ১৬৭৯ খ্রিষ্টাব্দে পঞ্চম দলাই লামা গুজ তিব্বতের অধিকারে নিয়ে আসেন। এই যুদ্ধের পর রাজধানী প্রচন্ড ক্ষতিগ্রস্ত হয়।[43] সাংস্কৃতিক বিপ্লবের সময় বহু মূর্তি ও চিত্রকলাকে ধ্বংস করে দেওয়া হলেও[43] বেশ কিছু অসাধারণ শিল্পকলা কোন ভাবে এই ধ্বংসলীলা থেকে বেঁচে গেছে।[43]", "bengali_question": "পশ্চিম তিব্বতের রাজধানী কোথায় ছিল ?", "bengali_answer": "থোলিং", "banglish_context": "Skyid-lde-nyima-goner opor putro o Zhangskar rajyer protisthata Lde-gtsug-mgoner putrohin obosthay mrityu hole 967 Khristabde Byang-chub-ye-shes'-od Guj, Pu-hrang, Zhangskar, Spiti, Lahul ebong uttar Kinnar oncholke ekotro kore ek songothito rajyer odhishwor hon.[32][33] Tini rajottokaler shurute Bka'-shog-chen-mo (Wylie: bka’ shog chen mo) namok ekta adesh jari kore tar rajot lness_1to5": "", "blind_id": "conversion-0072"}, {"bengali_context": "নারায়ণের বাবা যখন মহারাজা’স কলেজ হাইস্কুলে বদলি হয়ে যান, তখন নারায়ণ তাঁর পরিবারের সঙ্গে মহীশূরে চলে আসেন। এই বিদ্যালের গ্রন্থাগারটি ছিল অত্যন্ত সমৃদ্ধ। তাঁর বাবারও বইয়ের একটি বিশাল সংগ্রহ ছিল। নারায়ণের বই পড়ায় বিশেষ আগ্রহ থাকায় এতে তাঁর সুবিধাই হয়। এই সময় তিনি লেখালিখিও শুরু করেন। উচ্চ বিদ্যালয়ে পড়াশোনা শেষ করার পর নারায়ণ বিশ্ববিদ্যালয়ের প্রবেশিকা পরীক্ষায় অণুত্তীর্ণ হন। এই সময় এক বছর তিনি বাড়িতে থেকে পড়াশোনা ও লেখালিখি করতে থাকেন। ১৯২৬ সালে প্রবেশিকা পরীক্ষায় উত্তীর্ণ হয়ে তিনি মহারাজা কলেজ অফ মাইসোরে যোগদান করেন। সাধারণত তিন বছরে স্নাতক পাঠক্রমের পড়াশোনা শেষ হলেও, নারায়ণের এই পাঠক্রম শেষ করতে চার বছর লেগেছিল। তাঁর এক বন্ধু তাঁকে বলেছিলেন, স্নাতকোত্তর পাঠক্রমে পড়াশোনা করলে সাহিত্যের প্রতি তাঁর আগ্রহ কমে যাবে। তাই তিনি পড়াশোনা ছেড়ে কিছু সময়ের জন্য বিদ্যালয় শিক্ষকের চাকরি গ্রহণ করেন। কিন্তু সেই বিদ্যালয়ের প্রধান শিক্ষক তাঁকে শারীরশিক্ষার দায়িত্বে নিয়োগ করতে চাইলে তিনি চাকরি ছেড়ে দেন।[10] এই অভিজ্ঞতা থেকে নারায়ণ উপলব্ধি করেন যে, তাঁর একমাত্র কর্মজীবন লেখালিখির ক্ষেত্রেই হওয়া সম্ভব। তিনি বাড়িতে থেকে উপন্যাস রচনা করবেন বলে মনস্থির করেন।[14][15] তাঁর প্রথম প্রকাশিত রচনাটি ছিল ডেভেলপমেন্ট অফ মেরিটাইম লজ অফ সেভেনটিনথ সেঞ্চুরি ইংল্যান্ড নামে একটি বইয়ের সমালোচনা।[16] এরপর তিনি ইংরেজি সংবাদপত্র ও সাময়িক পত্রপত্রিকায় মাঝে মাঝে স্থানীয় বিষয় অবলম্বনে গল্প লিখতে শুরু করেন। লেখালিখি করে তিনি বিশেষ উপার্জন করতেন না (প্রথম বছরে তাঁর আয় ছিল নয় টাকা বারো আনা মাত্র)। কিন্তু তাঁর পরিবার ও বন্ধুবান্ধবেরা তাঁর এই প্রথাবহির্ভূত কর্মজীবন নির্বাচনের ব্যাপারটিকে শ্রদ্ধা ও সমর্থন করতেন।[17] ১৯৩০ সালে নারায়ণ তাঁর প্রথম উপন্যাস স্বামী অ্যান্ড ফ্রেন্ডস্‌ রচনা করেন।[16] তাঁর মামা এই প্রয়াসটিকে পরিহাস করেছিলেন।[18] প্রথম দিকে প্রকাশকরাও এটি ছাপতে চাননি।[9] এই বইতেই নারায়ণ মালগুডি নামে একটি শহরের কল্পনা করেছিলেন। এই শহরটি ছিল দেশের সামাজিক পরিস্থিতির একটি সুন্দর উপস্থাপনা। এখানে ঔপনিবেশিক শাসনের আরোপিত সীমাবদ্ধতাগুলি উপেক্ষিত হয়েছিল এবং শহরটি গড়ে উঠেছিল ব্রিটিশ ও স্বাধীনতা-উত্তর ভারতের     conf.fields.forEach(([f,lab])=>{
      fh+=`<div class="field"><div class="flabel">${lab}</div><div class="ftext">${esc(r[f])}</div></div>`;
    });
  }
  document.getElementById('card').innerHTML=`<div class="rowid">${esc(r.blind_id)}</div>${fh}`;

  const cur=L[r.blind_id];
  const ctr=document.getElementById('controls');
  if(conf.type==='conversion'){
    const mp=cur?cur.meaning_preserved:null, nat=cur?cur.naturalness_1to5:null;
    ctr.innerHTML=`
      <div class="grp"><span class="glab">Meaning preserved</span>
        <button class="abtn no ${mp==='No'?'sel':''}" data-mp="No">No (n)</button>
        <button class="abtn yes ${mp==='Yes'?'sel':''}" data-mp="Yes">Yes (y)</button>
        <button class="abtn skip ${mp==='SKIP'?'sel':''}" data-mp="SKIP">SKIP (s)</button>
      </div>
      <div class="grp"><span class="glab">Naturalness</span>
        ${[1,2,3,4,5].map(n=>`<button class="abtn num ${String(nat)===String(n)?'sel':''}" data-nat="${n}">${n}</button>`).join('')}
      </div>
      <div class="nav"><button id="prev">◀ Prev (←)</button><span class="hint">set both, then it auto-advances</span><button id="next">Next (→) ▶</button></div>`;
    ctr.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>setConv('meaning_preserved',b.dataset.mp));
    ctr.querySelectorAll('[data-nat]').forEach(b=>b.onclick=()=>setConv('naturalness_1to5',b.dataset.nat));
  } else {
    ctr.innerHTML=`<div class="btnrow">
        <button class="abtn no ${cur==='No'?'sel':''}" data-v="No">No — faithful (n)</button>
        <button class="abtn yes ${cur==='Yes'?'sel':''}" data-v="Yes">Yes — hallucinated (y)</button>
        <button class="abtn skip ${cur==='SKIP'?'sel':''}" data-v="SKIP">SKIP (s)</button>
      </div>
      <div class="nav"><button id="prev">◀ Prev (←)</button><span class="hint">n / y / s · arrows to move</span><button id="next">Next (→) ▶</button></div>`;
    ctr.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setYN(b.dataset.v));
  }
  document.getElementById('prev').onclick=()=>{idx--;render();};
  document.getElementById('next').onclick=()=>{idx++;render();};
}

function setYN(v){
  const r=DATA[curFile].rows[idx];labelsFor(curFile)[r.blind_id]=v;save();
  if(idx<DATA[curFile].rows.length-1){idx++;}render();
}
function setConv(field,val){
  const r=DATA[curFile].rows[idx];const L=labelsFor(curFile);
  const o=L[r.blind_id]&&typeof L[r.blind_id]==='object'?L[r.blind_id]:{};
  o[field]=val;L[r.blind_id]=o;save();
  if(o.meaning_preserved&&o.naturalness_1to5){ if(idx<DATA[curFile].rows.length-1) idx++; }
  render();
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  const conf=DATA[curFile];
  if(e.key==='ArrowLeft'){idx--;render();}
  else if(e.key==='ArrowRight'){idx++;render();}
  else if(conf.type!=='conversion'){
    if(e.key==='n'||e.key==='N')setYN('No');
    else if(e.key==='y'||e.key==='Y')setYN('Yes');
    else if(e.key==='s'||e.key==='S')setYN('SKIP');
  } else {
    if(e.key==='n'||e.key==='N')setConv('meaning_preserved','No');
    else if(e.key==='y'||e.key==='Y')setConv('meaning_preserved','Yes');
    else if(e.key==='s'||e.key==='S')setConv('meaning_preserved','SKIP');
    else if('12345'.includes(e.key))setConv('naturalness_1to5',e.key);
  }
});

document.getElementById('dl').onclick=()=>{
  const conf=DATA[curFile];const L=labelsFor(curFile);const rows=conf.rows;
  const base=conf.type==='conversion'
    ? ['blind_id','bengali_context','bengali_question','bengali_answer','banglish_context','banglish_question','banglish_answer','meaning_preserved','naturalness_1to5']
    : (conf.file.includes('summ')?['blind_id','document','summary','is_hallucinated']
       :conf.file.includes('reason')?['blind_id','problem','reasoning_answer','is_hallucinated']
       :['blind_id','context','question','answer','is_hallucinated']);
  const q=s=>{s=(s==null?'':String(s));return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  let out=base.join(',')+'\n';
  rows.forEach(r=>{
    const lab=L[r.blind_id];
    const rec={...r};
    if(conf.type==='conversion'){rec.meaning_preserved=lab?lab.meaning_preserved||'':'';rec.naturalness_1to5=lab?lab.naturalness_1to5||'':'';}
    else{rec.is_hallucinated=lab||'';}
    out+=base.map(c=>q(rec[c])).join(',')+'\n';
  });
  const blob=new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=conf.file;a.click();
};

idx=firstUnlabeled();
render();
</script>
</body>
</html>
